version: '3.8'

services:
  wagmi-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagmi-lab-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=Europe/Rome
    env_file:
      - .env
    volumes:
      # Persist logs
      - ./logs:/app/logs
      # Persist data (if using SQLite in future)
      - ./data:/app/data
    networks:
      - wagmi-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wagmi-network:
    driver: bridge
